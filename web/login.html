<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — Counter</title><link rel="stylesheet" href="/styles.css"></head>
<body class="min-h-screen bg-paper text-ink"><main class="grid min-h-screen lg:grid-cols-2"><section class="hidden bg-ink p-14 text-white lg:flex lg:flex-col lg:justify-between"><a class="text-2xl font-bold">counter<span class="text-accent">.</span></a><div><p class="max-w-md text-4xl font-semibold leading-tight">Good coffee starts with a smooth counter.</p><p class="mt-5 text-sm text-gray-400">Sales, cash, purchases, and inventory in one calm workspace.</p></div><p class="text-xs text-gray-500">The Daily Grind · Point of sale</p></section><section class="flex items-center justify-center p-6"><div class="w-full max-w-sm"><div class="mb-10 lg:hidden"><span class="text-2xl font-bold">counter<span class="text-accent">.</span></span></div><p class="text-xs font-semibold uppercase tracking-[.18em] text-accent">Welcome back</p><h1 class="mt-3 text-3xl font-semibold tracking-tight">Sign in to your workspace</h1><p class="mt-3 text-sm leading-6 text-gray-400">Use your staff account to open the register.</p><form id="login" class="mt-8 space-y-5"><label class="block text-xs font-medium text-gray-600">Email address<input name="email" type="email" autocomplete="username" required autofocus class="mt-2 h-12 w-full rounded-xl border border-gray-200 bg-white px-4 text-sm focus:border-orange-400"></label><div><label for="password" class="block text-xs font-medium text-gray-600">Password</label><div class="mt-2 flex items-center rounded-xl border border-gray-200 bg-white"><input id="password" name="password" type="password" autocomplete="current-password" required class="h-12 min-w-0 flex-1 rounded-xl px-4 text-sm"><button id="toggle-password" type="button" aria-controls="password" aria-label="Show password" aria-pressed="false" class="shrink-0 rounded-lg px-4 py-3 text-xs font-medium text-orange-600">Show</button></div></div><p id="error" role="alert" class="hidden rounded-lg bg-red-50 px-3 py-2 text-xs text-red-600"></p><button type="submit" class="w-full rounded-xl bg-accent py-3.5 text-sm font-semibold text-white hover:bg-orange-600 disabled:opacity-50">Sign in</button></form><p class="mt-6 text-center text-[11px] text-gray-400">Accounts are managed by your administrator.</p></div></section></main><script>document.querySelector('#toggle-password').addEventListener('click',()=>{const input=document.querySelector('#password'),toggle=document.querySelector('#toggle-password'),visible=input.type==='password';input.type=visible?'text':'password';toggle.textContent=visible?'Hide':'Show';toggle.setAttribute('aria-label',visible?'Hide password':'Show password');toggle.setAttribute('aria-pressed',String(visible))});document.querySelector('#login').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget,b=f.querySelector('button[type=submit]'),err=document.querySelector('#error');b.disabled=true;err.classList.add('hidden');try{const data=Object.fromEntries(new FormData(f));const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const body=await r.json();if(!r.ok)throw Error(body.error||'Sign in failed');const next=new URLSearchParams(location.search).get('next');location.replace(['/pos','/products','/session','/sales','/inventory','/purchases','/petty','/users','/settings'].includes(next)?next:'/pos')}catch(x){err.textContent=x.message;err.classList.remove('hidden');b.disabled=false}})</script></body></html>
