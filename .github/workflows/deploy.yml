name: CI and Deploy Fridge POS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fridge-pos-production
  cancel-in-progress: false

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: counter_test
          POSTGRES_USER: counter_test
          POSTGRES_PASSWORD: counter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U counter_test -d counter_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://counter_test:counter_test@localhost:5432/counter_test?sslmode=disable
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: npm run css

      - name: Download Go dependencies
        run: go mod download

      - name: Run Go tests
        run: go test ./...

      - name: Build application
        run: go build -trimpath -o fridge-pos .

  deploy:
    name: Deploy production
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -eu
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/fridge_deploy"
          chmod 600 "$HOME/.ssh/fridge_deploy"
          ssh-keyscan -H "$VPS_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Build and release on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -T \
            -i "$HOME/.ssh/fridge_deploy" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            "$VPS_USER@$VPS_HOST" 'bash -se' <<'DEPLOY'
          set -Eeuo pipefail

          readonly APP_DIR=/var/www/fridge.mekmaa.com
          readonly SERVICE=fridge-pos
          readonly BINARY="$APP_DIR/fridge-pos"
          readonly NEW_BINARY="$APP_DIR/fridge-pos.new"
          readonly BACKUP_BINARY="$APP_DIR/fridge-pos.backup"
          readonly HEALTH_URL=http://127.0.0.1:8886/healthz

          cd "$APP_DIR"

          echo "Fetching the requested release..."
          git fetch origin main
          git reset --hard origin/main

          echo "Building frontend assets..."
          npm ci
          npm run css

          echo "Testing and building the application..."
          go mod download
          go test ./...
          rm -f "$NEW_BINARY"
          go build -trimpath -o "$NEW_BINARY" .
          test -s "$NEW_BINARY"
          chmod 0755 "$NEW_BINARY"

          rollback() {
            echo "Release verification failed; restoring the previous binary." >&2
            set +e
            systemctl status "$SERVICE" --no-pager --full >&2
            journalctl -u "$SERVICE" -n 100 --no-pager >&2
            if [ -s "$BACKUP_BINARY" ]; then
              install -m 0755 "$BACKUP_BINARY" "$BINARY"
              systemctl restart "$SERVICE"
              if systemctl is-active --quiet "$SERVICE"; then
                echo "Previous release restored and service restarted." >&2
              else
                echo "Rollback was installed, but the service did not become active." >&2
                systemctl status "$SERVICE" --no-pager --full >&2
                journalctl -u "$SERVICE" -n 100 --no-pager >&2
              fi
            else
              echo "No rollback binary was available." >&2
            fi
            exit 1
          }

          if [ ! -s "$BINARY" ]; then
            echo "Current production binary is missing; refusing an unsafe release." >&2
            exit 1
          fi

          echo "Preserving the current production binary..."
          install -m 0755 "$BINARY" "$BACKUP_BINARY"

          echo "Installing the new release..."
          mv -f "$NEW_BINARY" "$BINARY"
          if ! systemctl restart "$SERVICE"; then
            rollback
          fi

          echo "Waiting for the local health check..."
          healthy=false
          for attempt in $(seq 1 20); do
            if systemctl is-active --quiet "$SERVICE" && \
               curl --fail --silent --show-error --max-time 5 "$HEALTH_URL" > /dev/null; then
              healthy=true
              break
            fi
            echo "Health check attempt $attempt/20 did not pass yet."
            sleep 2
          done

          if [ "$healthy" != true ]; then
            rollback
          fi

          echo "Production release passed the local health check."
          DEPLOY

      - name: Verify public endpoint
        run: |
          set -eu
          for attempt in $(seq 1 10); do
            if curl --fail --silent --show-error --max-time 10 \
              https://fridge.mekmaa.com/healthz > /dev/null; then
              echo "Public production verification passed."
              exit 0
            fi
            echo "Public verification attempt $attempt/10 did not pass yet."
            sleep 3
          done
          echo "Public production verification failed: /healthz did not return HTTP 200." >&2
          exit 1
