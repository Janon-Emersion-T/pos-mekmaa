services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: counter
      POSTGRES_USER: counter
      POSTGRES_PASSWORD: counter
    ports: ["${POSTGRES_PORT:-5433}:5432"]
    volumes: ["counter_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U counter -d counter"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  counter_postgres:
